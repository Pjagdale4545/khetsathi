<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${role} + ' Forgot Password'">Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-custom {
            background-color: #ffffff;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        .btn-green {
            background-color: #28a745;
            border-color: #28a745;
            color: white;
            transition: all 0.2s;
        }
        .btn-green:hover {
            background-color: #218838;
            border-color: #218838;
            box-shadow: 0 4px 6px rgba(40, 167, 69, 0.4);
        }
        .message-box { min-height: 40px; }
    </style>
</head>
<body>
<div class="container mx-auto p-4">
    <div class="flex justify-center">
        <div class="card-custom">
            <div class="text-center mb-6">
                <h2 th:text="${role} + ' ' + #{forgot_password.title}">Forgot Password</h2>
            </div>

            <!-- Message area -->
            <div id="message-area" class="message-box mb-4"></div>

            <!-- Form -->
            <form th:action="@{${actionUrl}}" method="post" id="forgot-password-form">
                <div class="mb-4">
                    <label for="mobile-number" class="block text-sm font-medium text-gray-700"
                           th:text="#{forgot_password.mobile_label}">Mobile Number</label>
                    <input type="text" id="mobile-number" name="mobileNumber"
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm
                           focus:outline-none focus:ring-green-500 focus:border-green-500"
                           placeholder="Enter your 10-digit mobile number" required>
                </div>

                <div class="mb-4">
                    <label for="new-password" class="block text-sm font-medium text-gray-700"
                           th:text="#{forgot_password.new_label}">New Password</label>
                    <input type="password" id="new-password" name="newPassword"
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm
                           focus:outline-none focus:ring-green-500 focus:border-green-500" required>
                </div>

                <div class="mb-6">
                    <label for="confirm-password" class="block text-sm font-medium text-gray-700"
                           th:text="#{forgot_password.confirm_label}">Confirm New Password</label>
                    <input type="password" id="confirm-password" name="confirmPassword"
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm
                           focus:outline-none focus:ring-green-500 focus:border-green-500" required>
                </div>

                <button type="submit" class="btn-green w-full py-2 px-4 rounded-lg font-semibold shadow-md"
                        th:text="#{forgot_password.submit_button}">
                    Create New Password
                </button>

            </form>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const form = document.getElementById('forgot-password-form');
    const messageArea = document.getElementById('message-area');
    const API_URL = /*[[@{${actionUrl}}]]*/;

    function showMessage(type, text) {
        const color = type === 'success' ? 'bg-green-100 border-green-400 text-green-700' :
                      type === 'warning' ? 'bg-yellow-100 border-yellow-400 text-yellow-700' :
                      'bg-red-100 border-red-400 text-red-700';
        messageArea.innerHTML = `
            <div class="border px-4 py-3 rounded relative ${color}" role="alert">
                <strong class="font-bold">${type.charAt(0).toUpperCase() + type.slice(1)}:</strong>
                <span class="block sm:inline">${text}</span>
            </div>
        `;
    }

    form.addEventListener('submit', async function(event) {
        event.preventDefault();
        messageArea.innerHTML = '';

        const mobileNumber = document.getElementById('mobile-number').value.trim();
        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        if (!/^\d{10}$/.test(mobileNumber)) {
            showMessage('warning', 'Please enter a valid 10-digit mobile number.');
            return;
        }

        if (newPassword !== confirmPassword) {
            showMessage('warning', 'New Password and Confirm Password must match exactly.');
            return;
        }

        if (newPassword.length < 6) {
            showMessage('warning', 'Password must be at least 6 characters long.');
            return;
        }

        const submitButton = form.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        submitButton.textContent = 'Processing...';

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mobileNumber, newPassword })
            });

            const result = await response.json();
            if (response.ok) {
                showMessage('success', result.message || 'Password reset successful.');
                form.reset();
            } else {
                showMessage('error', result.message || 'Failed to reset password.');
            }
        } catch (error) {
            console.error('Error:', error);
            showMessage('error', 'Could not connect to the server.');
        } finally {
            submitButton.disabled = false;
            submitButton.textContent = 'Create New Password';
        }
    });
</script>

</body>
</html>
